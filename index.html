<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e9e6">
  <meta name="robots" content="noindex">
  <meta name="description" content="12월 7일, 너에게 보내는 데이트 초대장">
  <meta property="og:title" content="12월 7일에 데이트 하쉴?">
  <meta property="og:description" content="거절은 없다.">
  <meta property="og:image" content="https://sjkim1127.github.io/december-7-invitation/assets/snow-cat.png">
  <title>12월 7일에 데이트 하쉴?</title>
  <link rel="preload" href="assets/snow-cat.png" as="image">
  <link rel="stylesheet" href="styles.css?v=nested">
  <script defer src="invitation.js?v=nested"></script>
</head>
<body>
  <main class="invitation">
    <header class="masthead">
      <span class="masthead-title"><span aria-hidden="true">♡</span> 너에게 보내는 초대장</span>
      <time datetime="2026-12-07" class="masthead-date">2026. 12. 07</time>
    </header>

    <div class="spread">
      <section class="letter" aria-labelledby="invitation-title">
        <p class="date-label"><span aria-hidden="true">✧</span> <time datetime="2026-12-07">12월 7일 월요일</time></p>
        <h1 id="invitation-title"><span>12월 7일에</span> <strong>데이트 하쉴?</strong></h1>
        <p class="note">거절은 없다.</p>

        <div class="reply" id="reply" hidden>
          <div class="choices" id="choices">
            <button class="button primary" id="accept" type="button">오키 <span aria-hidden="true">♥</span></button>
            <span class="escape-slot"><button class="button secondary" id="decline" type="button" aria-disabled="true" tabindex="-1"><span class="decline-face">ㄴㄴ</span></button></span>
          </div>
          <div class="response" id="response" hidden>
            <p><time datetime="2026-12-07">12월 7일 월요일</time> · 종일</p>
            <div class="choices">
              <a class="button primary" id="add-to-calendar" href="date.ics?v=title-2" type="text/calendar">캘린더에 추가</a>
              <button class="button secondary" id="reset" type="button">다시 고르기</button>
            </div>
          </div>
        </div>
        <noscript><a class="button primary" href="date.ics?v=title-2" type="text/calendar">캘린더에 추가</a></noscript>
      </section>

      <figure class="postcard">
        <div class="tape" aria-hidden="true"></div>
        <img src="assets/snow-cat.png" width="736" height="736" alt="빨간 리본을 단 고양이 모양 눈사람" fetchpriority="high">
      </figure>
    </div>
  </main>
  <div id="hearts" class="hearts" aria-hidden="true"></div>
</body>
</html>
